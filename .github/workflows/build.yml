name: Build APK & AAB

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:  # Bisa trigger manual dari GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission untuk gradlew
        run: chmod +x gradlew

      # ── Build DEBUG APK (untuk testing) ──────────────────────────
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: altan-eduweb-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      # ── Build RELEASE (hanya saat ada tag v*) ────────────────────
      - name: Build Release AAB
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=keystore.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload Release AAB ke GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/bundle/release/*.aab
          name: "Altan EduWeb ${{ github.ref_name }}"
          body: |
            ## Altan EduWeb ${{ github.ref_name }}
            
            Aplikasi mobile EduWeb untuk SMK Alhikmah Tanon
            
            ### Download
            - **AAB**: Upload ke Google Play Store
